<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Vercel Obsidian Black Base -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  
  <!-- Subtle 1px Outer Border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#27272a" stroke-width="3"/>

  <!-- Vercel-Style Geometric Monolith: Inverted Origin Triangle & Chevron Facet -->
  <!-- Outer Pure White Geometric Triangle -->
  <polygon points="256,416 96,138 416,138" fill="#ffffff"/>
  
  <!-- Inner Cutout Creating Sharp Architectural 'V' -->
  <polygon points="256,336 160,170 352,170" fill="#000000"/>

  <!-- Origin Point (Top Apex Core Dot) -->
  <circle cx="256" cy="100" r="14" fill="#ffffff"/>
</svg>
