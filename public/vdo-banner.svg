<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
    <radialGradient id="centerLight" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="320" fill="url(#bannerBg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#centerLight)"/>

  <!-- Futuristic Holographic Accent Lines -->
  <path d="M 0 316 L 1200 316" stroke="url(#neonGlow)" stroke-width="4"/>
  <path d="M 80 40 L 400 40 L 450 90" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Left Logo Emblem -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="180" height="180" rx="40" fill="#0b132b" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.8"/>
    <polygon points="50,30 150,24 140,120 40,126" fill="#6366f1" fill-opacity="0.3"/>
    <polygon points="40,40 140,34 130,130 30,136" fill="#06b6d4" fill-opacity="0.5"/>
    <polygon points="36,52 64,52 92,112 120,52 148,52 102,142 80,142" fill="url(#neonGlow)"/>
    <circle cx="92" cy="72" r="14" fill="#ffffff" fill-opacity="0.95"/>
    <text x="90" y="165" fill="#ffffff" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" letter-spacing="4" text-anchor="middle">VDO</text>
  </g>

  <!-- Typography & Hierarchy -->
  <g transform="translate(300, 110)">
    <!-- Subtitle Badge -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="15" cy="15" r="5" fill="#22c55e"/>
    <text x="32" y="20" fill="#93c5fd" font-size="12" font-family="monospace" font-weight="700" letter-spacing="1.5">EXECUTIVE INTELLIGENCE V2.0</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="-0.5">Visual Document Origin</text>

    <!-- Secondary Meta Description -->
    <text x="2" y="112" fill="#94a3b8" font-size="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" letter-spacing="0.5">結構化多維專案決策、全視界數據燃盡與敏捷協作交付樞紐</text>
  </g>

  <!-- Right Decorative Telemetry Cards -->
  <g transform="translate(920, 75)">
    <rect x="0" y="0" width="200" height="170" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="36" fill="#64748b" font-size="12" font-family="monospace" font-weight="600">THROUGHPUT RATE</text>
    <text x="20" y="78" fill="#38bdf8" font-size="36" font-family="sans-serif" font-weight="900">99.8%</text>
    <path d="M 20 105 Q 60 85, 100 115 T 180 95" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <text x="20" y="145" fill="#a1a1aa" font-size="11" font-family="sans-serif">● Real-time Synced Node</text>
  </g>
</svg>
