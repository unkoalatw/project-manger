<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background & Ambient Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#1d1e4e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glass Layer 1 (Back) -->
    <linearGradient id="glassBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glass Layer 2 (Middle) -->
    <linearGradient id="glassMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>

    <!-- 3D Crystalline Prism 'V' (Foreground) -->
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="originCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glass Specular Highlight Arc -->
    <linearGradient id="topHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadows & Glass Refraction Filters -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Apple Squircle Base Container -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#auraGlow)"/>
  <rect x="3" y="3" width="122" height="122" rx="28" fill="none" stroke="url(#squircleBorder)" stroke-width="1.5"/>

  <!-- 2. Ambient Light Refraction Sphere (Behind Glass) -->
  <circle cx="64" cy="50" r="32" fill="#3b82f6" fill-opacity="0.3" filter="url(#coreGlow)"/>
  <circle cx="78" cy="65" r="24" fill="#a855f7" fill-opacity="0.25" filter="url(#coreGlow)"/>

  <!-- 3. Glass Document Layer 1 (Back Frosted Sheet) -->
  <g transform="rotate(-8 64 64)" filter="url(#glassShadow)">
    <rect x="32" y="24" width="64" height="76" rx="14" fill="url(#glassBack)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="42" y1="36" x2="62" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="42" y1="46" x2="74" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.25"/>
  </g>

  <!-- 4. Glass Document Layer 2 (Middle Frosted Sheet) -->
  <g transform="rotate(6 64 64)" filter="url(#glassShadow)">
    <rect x="30" y="26" width="68" height="78" rx="14" fill="url(#glassMid)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.45"/>
    <line x1="42" y1="38" x2="66" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="42" y1="48" x2="80" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>
  </g>

  <!-- 5. 3D Floating Crystalline Glass 'V' Emblem (Foreground) -->
  <g filter="url(#glassShadow)">
    <!-- Left Prism Arm -->
    <path d="M 28 36 L 46 36 L 64 78 L 52 86 Z" fill="url(#prismLeft)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- Right Prism Arm -->
    <path d="M 100 36 L 82 36 L 64 78 L 76 86 Z" fill="url(#prismRight)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- Bottom Vertex Cap -->
    <path d="M 52 86 L 64 78 L 76 86 L 64 96 Z" fill="url(#prismLeft)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.9"/>
  </g>

  <!-- 6. Radiant Origin Jewel Core (Center Glow) -->
  <circle cx="64" cy="56" r="8" fill="url(#originCore)" filter="url(#coreGlow)"/>
  <circle cx="64" cy="56" r="3.5" fill="#ffffff"/>

  <!-- 7. macOS Glass Surface Specular Top Highlight -->
  <path d="M 6 28 C 6 14.5 14.5 6 28 6 L 100 6 C 113.5 6 122 14.5 122 28 C 122 36 64 48 6 28 Z" fill="url(#topHighlight)"/>
</svg>
