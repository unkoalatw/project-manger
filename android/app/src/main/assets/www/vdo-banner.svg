<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <!-- Vercel Pure Black Canvas -->
  <rect width="1200" height="320" fill="#000000"/>

  <!-- Subtle Vercel 32px Grid Background -->
  <pattern id="vercelGrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181b" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="320" fill="url(#vercelGrid)"/>

  <!-- Minimalist Radial Flash (Pure White Subtle Glow) -->
  <radialGradient id="centerWhiteGlow" cx="20%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="320" fill="url(#centerWhiteGlow)"/>

  <!-- Top / Bottom Monochromatic 1px Hairlines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#27272a" stroke-width="1"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#27272a" stroke-width="1"/>

  <!-- Left: Vercel Geometric VDO Monolith Card -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="220" height="220" rx="44" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Outer Inverted Triangle -->
    <polygon points="110,180 40,60 180,60" fill="#ffffff"/>
    <!-- Inner Cutout -->
    <polygon points="110,145 68,74 152,74" fill="#09090b"/>
    <!-- Origin Core Dot -->
    <circle cx="110" cy="44" r="6" fill="#ffffff"/>
  </g>

  <!-- Center: Vercel Typography & Layout -->
  <g transform="translate(350, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <polygon points="16,18 10,8 22,8" fill="#ffffff"/>
    <text x="32" y="17.5" fill="#ffffff" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">VDO ENGINE // V2.0</text>

    <!-- Main Headline -->
    <text x="0" y="76" fill="#ffffff" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="46" letter-spacing="-1.2">Visual Document Origin</text>

    <!-- Subtitle -->
    <text x="2" y="112" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500" font-size="16" letter-spacing="-0.2">結構化多維專案架構、極致黑白全域燃盡與敏捷協作中樞</text>

    <!-- Vercel Action Metrics -->
    <g transform="translate(2, 140)" fill="#71717a" font-family="'Geist Mono', 'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="0"><tspan fill="#ffffff" font-weight="700">01.</tspan> LOCAL_FIRST</text>
      <text x="140" y="0"><tspan fill="#ffffff" font-weight="700">02.</tspan> HYBRID_SYNC</text>
      <text x="280" y="0"><tspan fill="#ffffff" font-weight="700">03.</tspan> ZERO_CONFIG</text>
    </g>
  </g>

  <!-- Right: Vercel Monochromatic Telemetry Card -->
  <g transform="translate(930, 50)">
    <rect x="0" y="0" width="210" height="220" rx="20" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <text x="20" y="34" fill="#71717a" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEM_THROUGHPUT</text>
    <text x="20" y="82" fill="#ffffff" font-family="'Geist', sans-serif" font-weight="900" font-size="42">100<tspan font-size="20" fill="#a1a1aa">%</tspan></text>
    <text x="20" y="105" fill="#22c55e" font-family="'Geist Mono', monospace" font-size="10.5">● INTEGRITY: VERIFIED</text>

    <line x1="20" y1="125" x2="190" y2="125" stroke="#18181b" stroke-width="1"/>

    <g transform="translate(20, 142)" fill="#a1a1aa" font-family="'Geist Mono', monospace" font-size="10.5">
      <text x="0" y="0">LATENCY: 0.1ms</text>
      <text x="0" y="20">REGION: GLOBAL EDGE</text>
      <text x="0" y="40">UPTIME: 99.99%</text>
    </g>
  </g>
</svg>
