<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Blueprint Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#050e24"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Technical Blueprint Grids -->
    <pattern id="majorGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="minorGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00C0FF" stroke-width="0.35" stroke-opacity="0.12"/>
    </pattern>
    <radialGradient id="prismLight" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#minorGrid)"/>
  <rect width="1200" height="320" fill="url(#majorGrid)"/>
  <rect width="1200" height="320" fill="url(#prismLight)"/>

  <!-- Top & Bottom Laser Measurement Rulers -->
  <path d="M 0 0 L 1200 0 M 0 320 L 1200 320" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 0 16 L 1200 16" stroke="#00F2FE" stroke-width="0.6" stroke-dasharray="8,4" stroke-opacity="0.3"/>
  <path d="M 0 304 L 1200 304" stroke="#00F2FE" stroke-width="0.6" stroke-dasharray="8,4" stroke-opacity="0.3"/>
  
  <!-- Architectural Crosshair Calibration Markers -->
  <g stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.6">
    <path d="M 40 30 L 40 50 M 30 40 L 50 40" />
    <path d="M 1160 30 L 1160 50 M 1150 40 L 1170 40" />
    <path d="M 40 270 L 40 290 M 30 280 L 50 280" />
    <path d="M 1160 270 L 1160 290 M 1150 280 L 1170 280" />
  </g>

  <!-- Left: Geek Engineering Blueprint Origami Prism Logo -->
  <g transform="translate(70, 50)">
    <!-- Outer Blueprint Bounding Box -->
    <rect x="0" y="0" width="220" height="220" rx="20" fill="#040b1c" fill-opacity="0.85" stroke="#00E5FF" stroke-width="1.8" stroke-opacity="0.7"/>
    <rect x="10" y="10" width="200" height="200" rx="14" fill="none" stroke="#00F2FE" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.4"/>
    
    <!-- Blueprint Coordinate Ring -->
    <circle cx="110" cy="110" r="85" fill="none" stroke="#00E5FF" stroke-width="0.6" stroke-dasharray="4,4" stroke-opacity="0.35"/>
    <line x1="110" y1="15" x2="110" y2="205" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.3"/>
    <line x1="15" y1="110" x2="205" y2="110" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.3"/>

    <!-- Wireframe Isometric Polyhedron -->
    <polygon points="110,25 175,62 175,148 110,185 45,148 45,62" fill="none" stroke="#00C0FF" stroke-width="0.9" stroke-opacity="0.4" stroke-dasharray="5,3"/>

    <!-- Dynamic Blueprint V Facets -->
    <polygon points="110,180 44,55 74,42 110,125" fill="url(#facetGrad)" stroke="#00F2FE" stroke-width="2.2" filter="url(#glow)"/>
    <polygon points="110,180 176,55 146,42 110,125" fill="url(#facetGrad)" stroke="#00F2FE" stroke-width="2.2" filter="url(#glow)"/>
    
    <!-- Origin Convergence Core -->
    <polygon points="110,125 90,65 110,38 130,65" fill="#00F2FE" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="110" cy="180" r="5" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="44" cy="55" r="3.5" fill="#00F2FE"/>
    <circle cx="176" cy="55" r="3.5" fill="#00F2FE"/>
    <circle cx="110" cy="38" r="3.5" fill="#00F2FE"/>

    <!-- Dimension Label -->
    <text x="110" y="208" fill="#00E5FF" font-size="11" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" letter-spacing="3" text-anchor="middle">ORIGIN::(0,0,0)</text>
  </g>

  <!-- Center Typography & System Spec -->
  <g transform="translate(340, 75)">
    <!-- Terminal Status Pill -->
    <rect x="0" y="0" width="340" height="28" rx="6" fill="#071838" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="16" cy="14" r="4.5" fill="#00F2FE" filter="url(#glow)"/>
    <text x="32" y="19" fill="#38BDF8" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" letter-spacing="1.5">SYS.SPEC::BLUEPRINT_ENGINE_V2</text>
    
    <!-- Main Title -->
    <text x="0" y="78" fill="#FFFFFF" font-size="46" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" letter-spacing="-0.5">Visual Document Origin</text>
    
    <!-- Monospace Subtitle / Code Annotation -->
    <text x="2" y="112" fill="#00E5FF" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1.2">[ VDO ] 視覺化工程藍圖、多維文檔規格與即時燃盡中樞</text>
    
    <!-- Engineering Specs Metadata -->
    <g transform="translate(2, 134)" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">
      <text x="0" y="0">ARCH: HIERARCHICAL_FLOW</text>
      <text x="180" y="0">SYNC: DUAL_HYBRID_PIPE</text>
      <text x="360" y="0">STATUS: COMPILED_OPTIMAL</text>
    </g>
  </g>

  <!-- Right: Telemetry & Oscilloscope Blueprint Card -->
  <g transform="translate(930, 50)">
    <rect x="0" y="0" width="220" height="220" rx="16" fill="#040b1c" fill-opacity="0.9" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Card Header -->
    <path d="M 0 36 L 220 36" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="18" y="24" fill="#00E5FF" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1">THROUGHPUT_TELEMETRY</text>
    
    <!-- Large Metric -->
    <text x="18" y="78" fill="#FFFFFF" font-size="34" font-family="'JetBrains Mono', sans-serif" font-weight="900">100<tspan fill="#00E5FF" font-size="20">%</tspan></text>
    <text x="18" y="96" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', monospace">BURNDOWN INTEGRITY: HIGH</text>

    <!-- Digital Signal Wave -->
    <g transform="translate(18, 115)">
      <rect width="184" height="60" rx="6" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      <path d="M 0 30 L 25 30 L 40 10 L 55 50 L 70 20 L 95 35 L 115 15 L 135 45 L 150 25 L 184 30" fill="none" stroke="#00F2FE" stroke-width="2" filter="url(#glow)"/>
      <circle cx="184" cy="30" r="3" fill="#00F2FE"/>
    </g>

    <text x="18" y="200" fill="#38BDF8" font-size="10" font-family="'JetBrains Mono', monospace">● PIPELINE_ACTIVE: ONLINE</text>
  </g>
</svg>
